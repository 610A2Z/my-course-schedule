<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>秋季课程表 · 2026-2027</title>
  <style>
    :root { --ink:#1c3155; --muted:#6f7e98; --paper:#f6f8fc; --line:#e4eaf3; --blue:#356ae6; --blue-soft:#e9f0ff; --shadow:0 16px 40px rgba(41,65,110,.10); }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--ink); background:var(--paper); font-family:"Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    button,input { font:inherit; }
    .app { max-width:1440px; margin:0 auto; padding:32px 28px 48px; }
    .hero { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:26px; }
    .page-links { display:flex; gap:8px; margin-top:16px; }
    .page-link { display:inline-flex; align-items:center; padding:8px 12px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:white; text-decoration:none; font-size:13px; font-weight:800; box-shadow:0 3px 10px rgba(33,54,95,.04); }
    .page-link.active,.page-link:hover { color:white; border-color:var(--blue); background:var(--blue); }
    .eyebrow { color:var(--blue); font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:8px 0 6px; font-size:clamp(28px,4vw,46px); letter-spacing:-.04em; }
    .subtitle { margin:0; color:var(--muted); font-size:15px; }
    .week-badge { min-width:160px; padding:14px 18px; border-radius:16px; color:white; background:linear-gradient(135deg,#356ae6,#6d50d5); box-shadow:var(--shadow); }
    .week-badge small { display:block; opacity:.76; font-size:12px; }
    .week-badge strong { display:block; margin-top:3px; font-size:22px; }
    .controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:12px; margin-bottom:20px; border:1px solid var(--line); border-radius:18px; background:white; box-shadow:0 4px 14px rgba(33,54,95,.04); }
    .segmented { display:flex; padding:4px; border-radius:12px; background:#eff3f9; }
    .segmented button,.nav button { border:0; cursor:pointer; color:var(--muted); background:transparent; border-radius:9px; padding:9px 14px; font-weight:700; }
    .segmented button.active { color:#fff; background:var(--blue); box-shadow:0 2px 8px rgba(53,106,230,.25); }
    .nav { display:flex; align-items:center; gap:4px; margin-left:auto; }
    .nav button:hover { background:#f0f4fb; color:var(--ink); }
    #label { min-width:205px; text-align:center; font-weight:800; }
    .date-field { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
    input[type="date"] { border:1px solid var(--line); border-radius:9px; padding:8px 10px; color:var(--ink); background:white; }
    .panel { overflow:hidden; border:1px solid var(--line); border-radius:20px; background:white; box-shadow:var(--shadow); }
    .week-grid { display:grid; grid-template-columns:76px repeat(7,minmax(125px,1fr)); min-width:980px; }
    .schedule-wrap { overflow-x:auto; }
    .corner,.day-head { position:sticky; top:0; z-index:3; padding:15px 10px; border-bottom:1px solid var(--line); background:#fbfcff; }
    .corner { color:var(--muted); font-size:12px; }
    .day-head { text-align:center; font-size:13px; }
    .day-head b { display:block; font-size:15px; }
    .day-head.today { color:var(--blue); background:#f3f7ff; }
    .time { min-height:118px; padding:18px 10px; text-align:center; color:var(--muted); font-size:12px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:#fbfcff; }
    .time b { display:block; margin-bottom:5px; color:var(--ink); font-size:15px; }
    .cell { position:relative; min-height:118px; padding:7px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
    .class-card { position:relative; z-index:1; min-height:102px; padding:10px 10px 8px; border-radius:11px; color:#17325d; background:var(--card-bg); border-left:4px solid var(--card); overflow:hidden; }
    .class-card .title { margin-bottom:5px; font-weight:800; font-size:14px; line-height:1.3; }
    .class-card .meta { color:#536a8e; font-size:11px; line-height:1.5; }
    .class-card.special { border-left-width:6px; box-shadow:inset 0 0 0 1px var(--card); }
    .special-pill { display:inline-block; margin-bottom:6px; padding:2px 6px; border-radius:999px; color:var(--card); background:white; font-size:10px; font-weight:900; letter-spacing:.03em; }
    .legend { display:flex; flex-wrap:wrap; gap:10px; margin:0 2px 14px; color:var(--muted); font-size:12px; }
    .legend span { display:inline-flex; align-items:center; gap:6px; }
    .legend i { width:10px; height:10px; border-radius:50%; display:inline-block; }
    .empty { display:flex; align-items:center; justify-content:center; min-height:102px; color:#c1cad9; font-size:12px; }
    .day-view { padding:24px; }
    .day-title { display:flex; justify-content:space-between; align-items:center; gap:18px; padding-bottom:18px; border-bottom:1px solid var(--line); }
    .day-title h2 { margin:0; font-size:24px; }
    .day-title span { color:var(--muted); font-size:13px; }
    .timeline { margin-top:6px; }
    .timeline-item { display:grid; grid-template-columns:100px 1fr; gap:18px; padding:16px 0; border-bottom:1px solid var(--line); }
    .timeline-time { color:var(--muted); font-size:13px; font-weight:700; }
    .timeline-card { padding:15px 16px; border-left:5px solid var(--card); border-radius:12px; background:var(--card-bg); }
    .timeline-card h3 { margin:0 0 8px; font-size:17px; }
    .timeline-card p { margin:3px 0; color:#536a8e; font-size:13px; }
    .no-class { margin:44px 0; text-align:center; color:var(--muted); }
    .month { padding:14px; }
    .month-grid { display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); }
    .month-weekday { padding:10px; color:var(--muted); text-align:center; font-size:12px; font-weight:700; }
    .month-day { min-height:128px; padding:9px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
    .month-day.other { background:#fafbfe; color:#aab5c6; }
    .month-day.selected { outline:2px solid var(--blue); outline-offset:-2px; }
    .date-number { display:flex; align-items:center; justify-content:center; width:26px; height:26px; margin-bottom:6px; border-radius:50%; font-size:13px; font-weight:800; }
    .today .date-number { color:white; background:var(--blue); }
    .month-event { margin:4px 0; padding:4px 6px; border-left:3px solid var(--card); border-radius:4px; color:#355070; background:var(--card-bg); font-size:11px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .more { padding:2px 6px; color:var(--muted); font-size:11px; }
    .footer-note { margin:18px 4px 0; color:var(--muted); font-size:12px; line-height:1.7; }
    @media (max-width:700px) { .app { padding:22px 14px 36px; } .hero { flex-direction:column; } .week-badge { min-width:unset; } .nav { width:100%; justify-content:space-between; margin-left:0; } #label { min-width:0; flex:1; } .date-field { width:100%; justify-content:space-between; } .month { padding:6px; overflow-x:auto; } .month-grid { min-width:630px; } .month-day { min-height:106px; } .day-view { padding:18px; } }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div><div class="eyebrow">2026 - 2027 · 秋季学期</div><h1>我的课程表</h1><p class="subtitle">按教学周排课 · 日、周、月视图一键切换</p><nav class="page-links" aria-label="页面导航"><a class="page-link active" href="index.html">课程表</a><a class="page-link" href="exams.html">考试安排</a></nav></div>
      <div class="week-badge"><small>当前教学进度</small><strong id="weekBadge">第 1 周</strong></div>
    </section>
    <section class="controls" aria-label="课程表控制栏">
      <div class="segmented" role="tablist"><button class="active" data-view="day">日</button><button data-view="week">周</button><button data-view="month">月</button></div>
      <label class="date-field">选择日期 <input id="datePicker" type="date" /></label>
      <div class="nav"><button id="prev" aria-label="上一段">←</button><span id="label"></span><button id="next" aria-label="下一段">→</button><button id="today">回到今天</button></div>
    </section>
    <div class="legend"><span><i style="background:#d85b62"></i>考试</span><span><i style="background:#d79a28"></i>作业 / 提交</span><span><i style="background:#8a5fd1"></i>汇报 / 其他日程</span><span><i style="background:#2e9b78"></i>补课 / 调整</span></div>
    <section id="calendar" class="panel"></section>
    <p class="footer-note">数据依据《2026-2027秋研究生课程表》整理。PDF 仅按教学周列课，网页按 2026-08-31 为第 1 教学周周一；已录入调课、考试、汇报与重要提交节点；特殊日程使用独立颜色标注。课程块显示课程、教室、教师及生效教学周。</p>
  </main>
  <script>
    const semesterStart = new Date(2026, 7, 31); // 第 1 教学周周一（2026-08-31）
    const periods = [
      { id:'agenda', label:'日程', time:'时间见卡片' },
      { id:'1-2', label:'1 - 2 节', time:'08:30 - 10:05' }, { id:'3-4', label:'3 - 4 节', time:'10:20 - 11:55' },
      { id:'5-6', label:'5 - 6 节', time:'14:30 - 16:05' }, { id:'7-8', label:'7 - 8 节', time:'16:20 - 17:55' },
      { id:'9-11', label:'9 - 11 节', time:'19:30 - 21:55' }
    ];
    const courses = [
      { title:'医学论著写作', day:1, period:'1-2', weeks:[1,2,3,4,5,8,9], room:'二教 303', teacher:'高永平、何冲', color:'#e87070' },
      { title:'医学统计学', day:5, period:'1-2', weeks:[1,2,3,5,6,7,8], room:'二教 303', teacher:'廖利梅', color:'#7564cf' },
      { title:'硕士研究生英语', day:4, period:'3-4', weeks:[1,2,3,4,5,6,7], room:'二教 312', teacher:'李京南', color:'#5d91da' },
      { title:'医学统计学', day:5, period:'3-4', weeks:[1,2,3,5,6,7,8], room:'二教 303', teacher:'廖利梅', color:'#7564cf' },
      { title:'医学统计学（调课）', day:1, period:'3-4', weeks:[7], room:'二教 305', teacher:'廖利梅', color:'#7564cf', note:'原第4周周五第1-4节调课（第一部分）' },
      { title:'医学统计学（调课）', day:1, period:'3-4', weeks:[8], room:'二教 305', teacher:'廖利梅', color:'#7564cf', note:'原第4周周五第1-4节调课（第二部分）' },
      { title:'中国式现代化的理论与实践', day:1, period:'5-6', weeks:[1,2,3,4,5,7,8], room:'二教 303', teacher:'曹银忠', color:'#3cae98' },
      { title:'临床流行病学', day:2, period:'5-6', weeks:[1,2,3,4], room:'二教 308', teacher:'张旭东、吕宇', color:'#de748f' },
      { title:'中国式现代化的理论与实践', day:3, period:'5-6', weeks:[1,2,3,4,5,6], room:'二教 303', teacher:'曹银忠', color:'#3cae98' },
      { title:'医学伦理学', day:4, period:'5-6', weeks:[1,2,3,4,6,7,8,9], room:'二教 308', teacher:'孙明茵、王钧懿', color:'#5d91da' },
      { title:'中国式现代化的理论与实践', day:1, period:'7-8', weeks:[1,2,3,4,5,7], room:'二教 303', teacher:'曹银忠', color:'#3cae98' },
      { title:'临床流行病学', day:2, period:'7-8', weeks:[1,2,3,4], room:'二教 308', teacher:'张旭东、吕宇', color:'#de748f' },
      { title:'医学法律法规', day:4, period:'7-8', weeks:[1,2,3,4,6,7,8,9], room:'二教 308', teacher:'包明晶、熊健', color:'#e5a941' },
      { title:'马克思主义与社会科学方法论', day:1, period:'9-11', weeks:[1,2,3,4,5,7], room:'二教 303', teacher:'张冲', color:'#e87070' },
      { title:'医学文献检索', day:2, period:'9-11', weeks:[1,2,3,4], room:'二教 303', teacher:'杨俊玲', color:'#e5a941', timeNote:'9 - 11 节' },
      { title:'医学文献检索', day:2, period:'9-11', weeks:[5,6], room:'二教 303', teacher:'杨俊玲', color:'#e5a941', timeNote:'9 - 10 节' },
      { title:'临床思维', day:4, period:'9-11', weeks:[1,2], room:'二教 308', teacher:'陈琳、陈栖梧、包明晶、黄孝伦、庞明辉', color:'#3cae98', timeNote:'9 - 11 节' },
      { title:'临床思维', day:4, period:'9-11', weeks:[3,4,6,7,8], room:'二教 308', teacher:'陈琳、陈栖梧、包明晶、黄孝伦、庞明辉', color:'#3cae98', timeNote:'9 - 10 节' },
      { title:'循证医学', day:5, period:'9-11', weeks:[1,2,6,7], room:'二教 308', teacher:'姜涛、钟凌', color:'#7564cf', timeNote:'9 - 11 节' },
      { title:'循证医学', day:5, period:'9-11', weeks:[3,8], room:'二教 308', teacher:'姜涛、钟凌', color:'#7564cf', timeNote:'9 - 10 节' }
    ];
    const specialEvents = [
      { date:'2026-10-13', title:'临床流行病学 · 考试', period:'5-6', room:'二教 107', color:'#d85b62', bg:'#fff0f1', special:true, badge:'考试', timeOverride:'14:00 - 16:00', note:'堂上开卷考试 · 考场顺序号3 · 座位36 · 简答题、分析题；禁用电子产品' },
      { date:'2026-10-14', title:'医学文献检索 · 考试', period:'3-4', room:'二教 208', color:'#d85b62', bg:'#fff0f1', special:true, badge:'考试', timeOverride:'10:20 - 11:50', note:'堂上开卷笔试 · 考场顺序号3 · 座位36' },
      { date:'2026-10-14', title:'医学伦理学 · 补课', period:'9-11', room:'主楼东 319', color:'#2e9b78', bg:'#eaf8f3', special:true, badge:'补课', timeOverride:'19:30 - 21:05', note:'第9-10节' },
      { date:'2026-10-15', title:'医学伦理学 · 手写作业提交', period:'agenda', room:'课堂上交', color:'#d79a28', bg:'#fff7df', special:true, badge:'提交', timeOverride:'课堂时间', note:'婚检HIV告知法律分析；500+字，单页' },
      { date:'2026-10-18', title:'先修课程 · 考试', period:'5-6', room:'二教 306', color:'#d85b62', bg:'#fff0f1', special:true, badge:'考试', timeOverride:'14:00 - 16:00', note:'第四考场 · 临床医学专硕 · 120分钟' },
      { date:'2026-10-19', title:'医学论著写作 · 调课', period:'1-2', room:'二教 303', color:'#2e9b78', bg:'#eaf8f3', special:true, badge:'调课', timeOverride:'08:30 - 10:05', note:'原10月12日（第7周）课程顺延至下一周同一时间；教师：高永平、何冲' },
      { date:'2026-10-19', title:'英语 · Presentation', period:'agenda', room:'课堂', color:'#8a5fd1', bg:'#f4efff', special:true, badge:'汇报', timeOverride:'课堂时间', note:'英语课堂汇报' },
      { date:'2026-10-22', title:'入党申请书 · 提交', period:'agenda', room:'', color:'#d79a28', bg:'#fff7df', special:true, badge:'待办', timeOverride:'全天', note:'提交入党申请书' },
      { date:'2026-10-26', title:'循证医学 · 考试', period:'9-11', room:'地点待补充', color:'#d85b62', bg:'#fff0f1', special:true, badge:'考试', timeOverride:'18:30 - 20:30', note:'120分钟；考试形式待补充' },
      { date:'2026-10-29', title:'英语 · 期末考试', period:'3-4', room:'地点待补充', color:'#d85b62', bg:'#fff0f1', special:true, badge:'考试', timeOverride:'09:30 - 11:30', note:'第9周 · 120分钟' },
      { date:'2026-10-30', title:'医学伦理学 · 期末考试', period:'5-6', room:'二教 205', color:'#d85b62', bg:'#fff0f1', special:true, badge:'考试', timeOverride:'14:00 - 15:30', note:'堂上考试 · 考场顺序号3 · 座位36 · 90分钟' },
      { date:'2026-10-30', title:'医学伦理学 · 平时作业提交', period:'agenda', room:'考试现场', color:'#d79a28', bg:'#fff7df', special:true, badge:'提交', timeOverride:'考试当天', note:'案例分析题任选1题，纸质版；封面注明姓名、学号和专业' }
    ];
    const weekdayNames = ['周日','周一','周二','周三','周四','周五','周六'];
    let selected = new Date(), view = 'day';
    const $ = s => document.querySelector(s);
    const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const atMidnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const addDays = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
    const monday = d => addDays(d, (d.getDay()+6)%7 * -1);
    const weekNo = d => Math.floor((atMidnight(d)-atMidnight(semesterStart))/86400000/7)+1;
    const coursesFor = d => [...courses.filter(c => c.day === d.getDay() && c.weeks.includes(weekNo(d))), ...specialEvents.filter(x => x.date === iso(d))];
    const weekText = c => { if(!c.weeks) return ''; const runs=[]; c.weeks.forEach(w => { const last=runs[runs.length-1]; if(last && last[1]===w-1) last[1]=w; else runs.push([w,w]); }); return runs.map(([a,b])=>a===b?`第${a}周`:`第${a}-${b}周`).join('、'); };
    const card = c => `<div class="class-card ${c.special?'special':''}" style="--card:${c.color};--card-bg:${c.bg||c.color+'18'}">${c.badge?`<span class="special-pill">${c.badge}</span>`:''}<div class="title">${c.title}</div><div class="meta">${[c.room,c.teacher].filter(Boolean).join(' · ')}</div><div class="meta">${c.timeOverride ? c.timeOverride+' · ' : (c.timeNote ? c.timeNote+' · ' : '')}${weekText(c)}${c.note ? (weekText(c)?' · ':'')+c.note : ''}</div></div>`;
    function renderWeek(){ const start=monday(selected); $('#label').textContent=`${start.getMonth()+1}月${start.getDate()}日 - ${addDays(start,6).getMonth()+1}月${addDays(start,6).getDate()}日`; let html='<div class="schedule-wrap"><div class="week-grid"><div class="corner">节次 / 星期</div>'; for(let i=0;i<7;i++){const d=addDays(start,i), today=iso(d)===iso(new Date()); html+=`<div class="day-head ${today?'today':''}"><b>${weekdayNames[d.getDay()]}</b>${d.getMonth()+1}/${d.getDate()}</div>`;} periods.forEach(p=>{html+=`<div class="time"><b>${p.label}</b>${p.time}</div>`; for(let i=0;i<7;i++){const list=coursesFor(addDays(start,i)).filter(c=>c.period===p.id); html+=`<div class="cell">${list.map(card).join('')||'<div class="empty">无课程</div>'}</div>`;}}); html+='</div></div>'; $('#calendar').innerHTML=html; }
    function renderDay(){ const list=coursesFor(selected).sort((a,b)=>periods.findIndex(p=>p.id===a.period)-periods.findIndex(p=>p.id===b.period)); $('#label').textContent=`${selected.getFullYear()}年${selected.getMonth()+1}月`; let html=`<div class="day-view"><div class="day-title"><h2>${selected.getMonth()+1}月${selected.getDate()}日 · ${weekdayNames[selected.getDay()]}</h2><span>第 ${weekNo(selected)} 教学周</span></div>`; html+=list.length?'<div class="timeline">'+list.map(c=>{const p=periods.find(x=>x.id===c.period);return `<div class="timeline-item"><div class="timeline-time">${c.badge||c.timeNote||p.label}<br>${c.timeOverride||p.time}</div><div class="timeline-card" style="--card:${c.color};--card-bg:${c.bg||c.color+'18'}"><h3>${c.title}</h3><p>${[c.room,c.teacher].filter(Boolean).join(' · ')}</p><p>${weekText(c)}${c.note ? (weekText(c)?' · ':'')+c.note : ''}</p></div></div>`}).join('')+'</div>':'<p class="no-class">今天没有已安排课程</p>'; $('#calendar').innerHTML=html+'</div>'; }
    function renderMonth(){ const year=selected.getFullYear(), month=selected.getMonth(), first=new Date(year,month,1), start=addDays(first,-first.getDay()), end=new Date(year,month+1,0), total=Math.ceil((end.getDate()+first.getDay())/7)*7; $('#label').textContent=`${year}年${month+1}月`; let html='<div class="month"><div class="month-grid">'+weekdayNames.map(n=>`<div class="month-weekday">${n}</div>`).join(''); for(let i=0;i<total;i++){const d=addDays(start,i), list=coursesFor(d), same=d.getMonth()===month, today=iso(d)===iso(new Date()), picked=iso(d)===iso(selected); html+=`<div class="month-day ${same?'':'other'} ${today?'today':''} ${picked?'selected':''}" data-date="${iso(d)}"><div class="date-number">${d.getDate()}</div>${list.slice(0,3).map(c=>`<div class="month-event" style="--card:${c.color};--card-bg:${c.color}18">${c.title}</div>`).join('')}${list.length>3?`<div class="more">+ ${list.length-3} 门课程</div>`:''}</div>`;} $('#calendar').innerHTML=html+'</div></div>'; document.querySelectorAll('.month-day').forEach(el=>el.onclick=()=>{selected=new Date(el.dataset.date+'T00:00:00');view='day';sync();}); }
    function render(){ $('#weekBadge').textContent=`第 ${weekNo(selected)} 周`; ({day:renderDay,week:renderWeek,month:renderMonth})[view](); }
    function sync(){ $('#datePicker').value=iso(selected); document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view)); render(); }
    document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;sync();});
    $('#datePicker').onchange=e=>{selected=new Date(e.target.value+'T00:00:00');sync();}; $('#today').onclick=()=>{selected=new Date();sync();};
    $('#prev').onclick=()=>{selected=addDays(selected,view==='day'?-1:view==='week'?-7:-new Date(selected.getFullYear(),selected.getMonth(),0).getDate());sync();};
    $('#next').onclick=()=>{selected=addDays(selected,view==='day'?1:view==='week'?7:new Date(selected.getFullYear(),selected.getMonth()+1,0).getDate());sync();};
    sync();
  </script>
</body>
</html>
